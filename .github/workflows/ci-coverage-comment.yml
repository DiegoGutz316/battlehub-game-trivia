# Actualiza el comentario de cobertura del PR cuando termina CI Backend o CI Frontend.
# Cada flujo sube solo su reporte, así que aquí se buscan los dos en el mismo commit.
name: CI Coverage Comment

on:
  workflow_run:
    workflows: ["CI Backend", "CI Frontend"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

# Si los dos flujos terminan a la vez, el segundo comentario espera al primero y ya ve ambos reportes.
concurrency:
  group: coverage-comment-${{ github.event.workflow_run.head_sha }}

jobs:
  coverage-comment:
    name: coverage-comment
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve PR
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];
            if (prs.length > 0) {
              core.setOutput('number', String(prs[0].number));
              return;
            }
            const { owner, repo } = context.repo;
            const headOwner = run.head_repository?.owner?.login || owner;
            const pulls = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${headOwner}:${run.head_branch}`
            });
            if (!pulls.data.length) {
              core.setOutput('number', '');
              return;
            }
            core.setOutput('number', String(pulls.data[0].number));

      - name: Find coverage reports
        id: reports
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, event: 'pull_request', head_sha: context.payload.workflow_run.head_sha, per_page: 100
            });
            for (const [part, workflow] of [['backend', 'CI Backend'], ['frontend', 'CI Frontend']]) {
              // La API entrega primero la ejecución más reciente.
              const flow = data.workflow_runs.find(run => run.name === workflow);
              if (!flow) continue;
              const { data: found } = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: flow.id, name: `coverage-${part}`
              });
              if (found.artifacts.some(artifact => !artifact.expired)) core.setOutput(`${part}-run`, String(flow.id));
              else if (flow.status !== 'completed') core.setOutput(`${part}-state`, 'running');
              // Un flujo exitoso sin reporte omitió sus pruebas porque esa parte no cambió.
              else if (flow.conclusion === 'success') core.setOutput(`${part}-state`, 'unchanged');
            }

      # Con `name`, la acción deja el archivo en `path`. Con `pattern` y un solo reporte no crea la subcarpeta.
      - name: Download backend coverage
        if: steps.reports.outputs.backend-run != ''
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          run-id: ${{ steps.reports.outputs.backend-run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: coverage-backend
          path: coverage/coverage-backend

      - name: Download frontend coverage
        if: steps.reports.outputs.frontend-run != ''
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          run-id: ${{ steps.reports.outputs.frontend-run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: coverage-frontend
          path: coverage/coverage-frontend

      - name: Build comment markdown
        if: steps.pr.outputs.number != ''
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BACKEND_STATE: ${{ steps.reports.outputs.backend-state }}
          FRONTEND_STATE: ${{ steps.reports.outputs.frontend-state }}
          COVERAGE_THRESHOLD: "85"
          ENFORCE_COVERAGE: "true"
        run: |
          node .github/scripts/coverage.mjs comment \
            coverage/coverage-backend/Summary.json \
            coverage/coverage-frontend/coverage-summary.json \
            coverage-comment.md

      - name: Post or update comment
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('coverage-comment.md')) return;
            const body = fs.readFileSync('coverage-comment.md', 'utf8');
            const marker = '<!-- trivia-coverage-report -->';
            const { owner, repo } = context.repo;
            const issue_number = Number('${{ steps.pr.outputs.number }}');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
