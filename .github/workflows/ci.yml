name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Mínimo de cobertura de líneas (requisito del profesor).
  COVERAGE_THRESHOLD: "85"
  # "true": los jobs backend y frontend fallan si la cobertura es menor al mínimo ("false" solo avisa).
  ENFORCE_COVERAGE: "true"

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # todo el historial: un secreto borrado sigue en los commits anteriores

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan for secrets
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --verbose --no-banner'

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build
        run: dotnet build --no-restore

      - name: Unit tests
        run: dotnet test tests/BattleHub.Trivia.UnitTests --no-build --collect:"XPlat Code Coverage" --results-directory coverage/raw

      - name: Integration tests
        run: dotnet test tests/BattleHub.Trivia.IntegrationTests --no-build --collect:"XPlat Code Coverage" --results-directory coverage/raw

      - name: Coverage report
        # Excluye el código que genera el compilador (*.g.cs, *.generated.cs), por ejemplo el de Microsoft.AspNetCore.OpenApi.
        run: |
          dotnet reportgenerator "-reports:coverage/raw/**/coverage.cobertura.xml" -targetdir:coverage/backend "-reporttypes:JsonSummary;MarkdownSummaryGithub" "-filefilters:-*.g.cs;-*.generated.cs"
          cat coverage/backend/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: coverage/backend/Summary.json

      - name: Coverage threshold
        run: node .github/scripts/coverage.mjs check backend coverage/backend/Summary.json

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/trivia-frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version-file: src/trivia-frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/trivia-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx jest --ci

      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: src/trivia-frontend/coverage/coverage-summary.json

      - name: Coverage threshold
        run: node ../../.github/scripts/coverage.mjs check frontend coverage/coverage-summary.json

  frontend-docker:
    name: frontend-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag battlehub-trivia-frontend:ci src/trivia-frontend

      - name: Smoke test
        run: |
          docker run --detach --name trivia-frontend --publish 4002:8080 battlehub-trivia-frontend:ci
          for attempt in $(seq 1 15); do
            curl --fail --silent --output /dev/null http://localhost:4002/remoteEntry.js && break
            sleep 1
          done
          curl --fail --silent --show-error --head http://localhost:4002/remoteEntry.js | tee headers.txt
          grep --ignore-case "^access-control-allow-origin: \*" headers.txt
          curl --fail --silent --show-error http://localhost:4002/ | grep --quiet "<html"
          docker image ls battlehub-trivia-frontend:ci --format "Imagen del frontend: {{.Size}}" >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs
        if: failure()
        run: docker logs trivia-frontend || true

  backend-docker:
    name: backend-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --file src/BattleHub.Trivia.Api/Dockerfile --tag battlehub-trivia-api:ci .

      - name: Smoke test
        run: |
          # Contraseña de SQL Server solo para este job: se genera aquí, se oculta en los registros y no se guarda.
          sql_password="Tv7-$(openssl rand -hex 16)"
          echo "::add-mask::$sql_password"

          docker network create trivia-net
          docker run --detach --name trivia-sql --network trivia-net \
            --env ACCEPT_EULA=Y --env MSSQL_SA_PASSWORD="$sql_password" \
            mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04

          # sqlcmd está en mssql-tools18 o en mssql-tools, según la versión de la imagen.
          sqlcmd="$(docker exec trivia-sql sh -c 'ls /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd 2>/dev/null | head -n 1')"
          query() {
            docker exec --env SQLCMDPASSWORD="$sql_password" trivia-sql "$sqlcmd" -S localhost -U sa -C -b -h -1 -W "$@"
          }
          for attempt in $(seq 1 60); do
            query -Q "SELECT 1" > /dev/null 2>&1 && break
            sleep 2
          done
          query -Q "SELECT 1" > /dev/null

          # El emisor y la audiencia de los tokens vienen de appsettings.json; las claves se descargan del emisor al validar un token.
          docker run --detach --name trivia-api --network trivia-net --publish 5185:8080 \
            --env ConnectionStrings__Trivia="Server=trivia-sql,1433;Database=BattleHubTrivia;User Id=sa;Password=$sql_password;TrustServerCertificate=true" \
            --env Database__MigrateOnStartup=true --env Database__SeedQuestions=true \
            battlehub-trivia-api:ci

          # La API migra y carga las preguntas antes de empezar a responder.
          for attempt in $(seq 1 60); do
            curl --fail --silent --output /dev/null http://localhost:5185/health && break
            sleep 2
          done
          curl --fail --silent --show-error http://localhost:5185/health | grep --quiet "^Healthy$"

          counts="$(query -d BattleHubTrivia -Q "SET NOCOUNT ON; SELECT CONCAT((SELECT COUNT(*) FROM __EFMigrationsHistory), ',', (SELECT COUNT(*) FROM Questions), ',', (SELECT COUNT(*) FROM AnswerOptions));" | tr -d '[:space:]')"
          echo "Migraciones, preguntas y opciones: $counts"
          test "$counts" = "5,30,120"

          docker image ls battlehub-trivia-api:ci --format "Imagen de la API: {{.Size}}" >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs
        if: failure()
        run: |
          docker logs trivia-api || true
          docker logs trivia-sql || true

  coverage-comment:
    name: coverage-comment
    # Comenta también cuando la cobertura hace fallar backend o frontend.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Download coverage summaries
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage

      - name: Build comment
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/coverage.mjs comment coverage/coverage-backend/Summary.json coverage/coverage-frontend/coverage-summary.json coverage-comment.md

      - name: Post or update comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage-comment.md', 'utf8');
            const marker = '<!-- trivia-coverage-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
