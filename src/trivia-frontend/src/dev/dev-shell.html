<div class="trivia-dev">
  <header class="trivia-dev-bar">
    <h2>Modo playground (sin Shell)</h2>
    <p>Jugador <strong>${context.currentUser.displayName}</strong> · otro nombre: <code>?displayName=Jugador%202</code></p>
    <p>
      <button click.trigger="start()">start()</button>
      <button click.trigger="pause()">pause()</button>
      <button click.trigger="dispose()">dispose()</button>
    </p>
  </header>
  <p class="trivia-dev-error" if.bind="error" data-testid="dev-error">LIFECYCLE_ERROR: ${error}</p>

  <!-- Área del juego con los tamaños mínimo y máximo del contrato visual (03-contratos-tecnicos.md §7). -->
  <div class="trivia-dev-game-area">
    <trivia-game-module component.ref="game"></trivia-game-module>
  </div>
</div>
