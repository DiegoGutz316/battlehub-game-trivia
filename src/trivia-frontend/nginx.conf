server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/css;

    # nginx no hereda add_header del server si la location define los suyos, por eso se repite CORS.
    # ADR-003 §8: el Shell descarga remoteEntry.js y los chunks desde otro origen.

    # Cambia en cada despliegue sin cambiar de nombre: siempre se revalida.
    location = /remoteEntry.js {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
    }

    # Llevan el hash del contenido en el nombre.
    location ~* \.bundle\.js$ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
